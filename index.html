<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrasi AMSO 2026</title>

    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AMSO-FESA/AMSO-2026/main/amso.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(20, 26, 50, 0.65);
            --card-border: rgba(0, 210, 255, 0.2);
            --neon-blue: #00d2ff;
            --neon-purple: #9d4edd;
            --gold: #ffd700;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; overflow-y: scroll; overflow-x: hidden; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(157, 78, 221, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* SPACE & FLOATING ICONS */
        .space-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0b0f25 0%, #03050a 100%);
        }

        .stars {
            position: absolute; width: 100%; height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 120px, var(--neon-blue), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 100px 60px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 160px, var(--gold), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 250px 90px, var(--neon-purple), rgba(0,0,0,0));
            background-repeat: repeat; background-size: 250px 250px;
            opacity: 0.45; animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 0.8; } }

        .galaxy-blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.18; animation: floatBlob 15s infinite alternate ease-in-out; }
        .blob-1 { width: 450px; height: 450px; background: var(--neon-blue); top: -5%; left: -10%; }
        .blob-2 { width: 550px; height: 550px; background: var(--neon-purple); bottom: -10%; right: -10%; animation-delay: -5s; }
        .blob-3 { width: 350px; height: 350px; background: var(--gold); top: 40%; right: 20%; animation-delay: -8s; opacity: 0.1; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.15); }
        }

        .floating-icon { position: absolute; color: var(--neon-blue); opacity: 0.55; user-select: none; filter: drop-shadow(0 0 12px currentColor); }
        .el-rocket { top: 12%; right: 7%; font-size: 2.8rem; animation: flyRocket 14s infinite ease-in-out; }
        .el-astronaut1 { bottom: 15%; left: 4%; font-size: 2.5rem; color: var(--gold); animation: floatItem1 11s infinite alternate ease-in-out; }
        .el-astronaut2 { top: 35%; left: 8%; font-size: 2rem; color: var(--neon-purple); animation: floatItem2 9s infinite alternate ease-in-out; opacity: 0.4; }
        .el-atom { top: 18%; left: 15%; font-size: 2.2rem; color: var(--gold); animation: rotateAtom 12s infinite linear; }
        .el-flask { bottom: 25%; right: 12%; font-size: 2.3rem; animation: floatItem1 8s infinite alternate ease-in-out; }
        .el-magnet { top: 60%; left: 12%; font-size: 2.2rem; color: #ff4757; animation: floatItem2 10s infinite alternate ease-in-out; }
        .el-satellite { top: 8%; left: 40%; font-size: 2.2rem; color: var(--text-muted); animation: flySatellite 16s infinite linear; }
        .el-math1 { top: 25%; right: 25%; font-size: 2rem; font-family: 'Orbitron', sans-serif; color: var(--gold); animation: floatItem2 7s infinite alternate ease-in-out; font-weight: 800; }
        .el-math2 { top: 75%; left: 25%; font-size: 2.2rem; font-family: 'Orbitron', sans-serif; color: var(--neon-blue); animation: floatItem1 9s infinite alternate ease-in-out; font-weight: 800; }
        .el-math3 { top: 50%; right: 8%; font-size: 1.8rem; font-family: 'Orbitron', sans-serif; color: var(--neon-purple); animation: floatItem2 8s infinite alternate ease-in-out; font-weight: 800; }

        @keyframes flyRocket { 0% { transform: translate(0, 0) rotate(45deg); } 50% { transform: translate(-50px, 70px) rotate(40deg); } 100% { transform: translate(0, 0) rotate(45deg); } }
        @keyframes floatItem1 { 0% { transform: translateY(0) rotate(-10deg); } 100% { transform: translateY(-45px) rotate(15deg); } }
        @keyframes floatItem2 { 0% { transform: translateY(0) rotate(10deg); } 100% { transform: translateY(35px) rotate(-15deg); } }
        @keyframes rotateAtom { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(360deg) scale(1); } }
        @keyframes flySatellite { 0% { transform: translateX(-50vw) translateY(0) rotate(0deg); } 100% { transform: translateX(100vw) translateY(-30px) rotate(360deg); } }

        .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; width: 100%; }

        /* HEADER */
        header { padding: 30px 0 25px; text-align: center; position: relative; }
        .logo-group { display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 25px; flex-wrap: wrap; }
        .logo-item { background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; border: none; box-shadow: none; transition: transform 0.3s ease, filter 0.3s ease; }
        .logo-item:hover { transform: scale(1.08); filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.6)); }
        .logo-item img { width: auto; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2)); }
        .logo-item img[alt="Logo Yasarini"] { height: 65px !important; }
        .logo-item img[alt="Logo FESA"] { height: 100px !important; }
        .logo-item img[alt="Logo AMSO"] { height: 100px !important; }

        nav {
            background: rgba(15, 21, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 8px;
            backdrop-filter: blur(12px);
            display: inline-flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a:hover, nav a.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.3), rgba(157, 78, 221, 0.3));
            border: 1px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .dropdown { position: relative; display: inline-flex; padding-bottom: 15px; margin-bottom: -15px; }
        .dropdown-content {
            display: none; position: absolute; top: 100%; left: 50%;
            transform: translateX(-50%); background: rgba(15, 21, 42, 0.95);
            border: 1px solid var(--card-border); border-radius: 15px; min-width: 190px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); backdrop-filter: blur(15px);
            z-index: 100; padding: 8px; text-align: left;
        }

        .dropdown-content a {
            color: var(--text-muted); padding: 10px 15px; text-decoration: none;
            display: block; border-radius: 10px; font-size: 0.85rem; white-space: nowrap; transition: all 0.2s ease;
        }

        .dropdown-content a:hover, .dropdown-content a.active {
            background: rgba(0, 210, 255, 0.15); color: var(--neon-blue); border: none; box-shadow: none; transform: none;
        }

        .dropdown:hover .dropdown-content { display: block; }

        .main-title {
            font-family: 'Orbitron', sans-serif; font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 900; letter-spacing: 3px;
            background: linear-gradient(135deg, #ffffff 0%, var(--neon-blue) 60%, var(--neon-purple) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(0, 210, 255, 0.3); margin-bottom: 10px;
        }

        .sub-title {
            font-size: clamp(0.9rem, 2vw, 1.1rem); color: var(--text-muted);
            letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-bottom: 25px;
        }

        /* LAYOUT DUA KOLOM */
        main { flex: 1; padding: 20px 0 60px; }
        .admin-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .column-left {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            height: auto;
            overflow: hidden;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            color: var(--gold);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ACCORDION DROPDOWNS */
        .admin-accordion {
            background: rgba(15, 21, 42, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
        }

        .admin-accordion:hover {
            border-color: rgba(0, 210, 255, 0.5);
        }

        .accordion-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.12), rgba(0, 210, 255, 0.08));
            transition: all 0.3s ease;
            gap: 10px;
        }

        .accordion-header:hover {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.22), rgba(0, 210, 255, 0.15));
        }

        .accordion-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .accordion-title-wrap i {
            font-size: 1.25rem;
            color: var(--neon-blue);
            flex-shrink: 0;
        }

        .accordion-title-wrap span {
            font-weight: 700;
            font-size: 0.98rem;
            color: #fff;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .accordion-arrow {
            color: var(--gold);
            font-size: 0.95rem;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .admin-accordion.open .accordion-arrow {
            transform: rotate(180deg);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(10, 14, 30, 0.65);
        }

        .admin-accordion.open .accordion-content {
            max-height: 380px;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .accordion-content::-webkit-scrollbar { width: 5px; }
        .accordion-content::-webkit-scrollbar-track { background: rgba(15, 21, 42, 0.5); }
        .accordion-content::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--neon-purple), var(--neon-blue));
            border-radius: 10px;
        }

        .dropdown-items-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .dropdown-item-card {
            background: rgba(20, 26, 50, 0.9);
            border: 1px solid rgba(255,
